name: Deploy to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Install headless Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Prerender each route to a real static file
        run: npm run prerender

      - name: Fix client-side routing (SPA fallback for any unlisted path)
        run: cp dist/index.html dist/404.html

      - name: Deploy built files to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r dist /tmp/site-dist
          git fetch origin main
          git checkout main
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r /tmp/site-dist/. .
          git add -A
          git diff --cached --quiet || git commit -m "deploy: update built site from source"
          git push origin main
